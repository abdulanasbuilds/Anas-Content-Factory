[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anas-content-factory"
version = "0.3.0"
description = "Local-first autonomous video/content post-production factory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
acf = "acf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
